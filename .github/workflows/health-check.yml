name: Synthetic Health Probing

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Probe Live Make.com Cluster Webhooks
        run: npm run probe
