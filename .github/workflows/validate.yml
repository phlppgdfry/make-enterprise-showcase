name: Validate Make.com Blueprints

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Run Blueprint Validation Suite
      run: npm test

    - name: Run Architecture & Security Compliance Audit
      run: npm run audit
