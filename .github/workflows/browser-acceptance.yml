name: Browser acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04 # pinned: Playwright can't install browsers on ubuntu-26.04 yet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-failure-evidence
          path: test-results/
          retention-days: 7
